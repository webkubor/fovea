name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      - name: every contract guard is tested (mutation check)
        run: bun scripts/mutate.mjs
      - run: bun scripts/release.mjs check
      - name: package contents match the manifest
        run: bun pm pack --dry-run
