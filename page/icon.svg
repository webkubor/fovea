<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Fovea">
  <title>Fovea — sharp centre, fading periphery</title>
  <!-- magpie draws a page's tab icon as a plain <img> (no currentColor, no
       dark variant), so the mark carries its own tile: legible on the light
       and the dark sidebar alike -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f86c9"/>
      <stop offset="1" stop-color="#2a5592"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#g)"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="9"/>
  <circle cx="64" cy="64" r="27" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="10"/>
  <circle cx="64" cy="64" r="11" fill="#fff"/>
</svg>
